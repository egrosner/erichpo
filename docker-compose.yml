services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file:
      - apps/backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/database/pr-channels.db
      PORT: 4848
    volumes:
      - ./database:/app/database
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_GITHUB_APP_URL: https://github.com/apps/erichpo/installations/new
    restart: unless-stopped

  caddy:
    image: caddy:alpine
    ports:
      - "4847:4847"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
